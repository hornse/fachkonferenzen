<!DOCTYPE html>
<html lang="de" data-projekt="fachkonferenzen">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Fachkonferenzen · FRG Düsseldorf</title>
    <!-- Tokens zuerst, die projekteigene Datei zuletzt: So gewinnt
         style.css im Zweifel, und die Werte kommen dennoch aus einer
         Quelle. -->
    <link rel="stylesheet" href="/vendor/ci-css/ci-tokens.css?v=20260817232449">
    <link rel="stylesheet" href="/vendor/ci-css/ci-komponenten.css?v=20260817232449">
    <link rel="stylesheet" href="/vendor/ci-css/ci-shell.css?v=20260817232449">
    <link rel="stylesheet" href="/style.css?v=20260817232449">
</head>
<body class="ci-seite">

<a href="#ansicht" class="skip-link">Zum Inhalt springen</a>

<!-- Gerüst aus hornse/ci-css, Variante Kopfleiste: fünf
     Navigationspunkte. Eine Seitenleiste verschenkte hier ein Sechstel
     der Bildschirmbreite an vier Wörter. -->
<div class="ci-huelle ci-huelle--kopf" data-ci-huelle data-leiste="voll"
     data-ci-icons="/vendor/ci-css/ci-icons.svg?v=20260817232449">

    <header class="ci-leiste">
        <div class="ci-leiste-innen">
            <a href="#/" class="ci-schild">
                <!-- Statisches Logo: fachkonferenzen hat kein Branding
                     (keinen Logo-Endpunkt, keine Einstellungstabelle).
                     Liegt frontend/logo.png vor, tritt es an die Stelle
                     des Platzhalters; sonst bleibt das Paragraphenzeichen.
                     Ein Schullogo aendert sich alle paar Jahre – dafuer
                     eine Verwaltungsmaske zu bauen waere unverhaeltnismaessig. -->
                <span class="ci-schild-platzhalter" id="schild-platzhalter" aria-hidden="true">§</span>
                <img id="schild-logo" class="ci-schild-logo" src="/logo.png" alt="" hidden>
                <span class="ci-schild-text">
                    <span class="ci-schild-name">Fachkonferenzen</span>
                    <span class="ci-schild-schule">Friedrich-Rückert-Gymnasium</span>
                </span>
            </a>

            <button type="button" class="ci-menue-knopf" data-ci-menue aria-expanded="false">
                <svg class="ci-symbol" aria-hidden="true"><use href="/vendor/ci-css/ci-icons.svg#ci-i-menue"></use></svg>
                Menü
            </button>

            <nav id="nav" class="ci-nav" aria-label="Hauptnavigation"></nav>
            <div id="benutzer" class="ci-kopf-rechts"></div>
        </div>
    </header>

    <!-- aria-live stand vorher auf dem GESAMTEN Inhaltsbereich. Bei
         jedem Ansichtswechsel wurde damit die komplette Seite
         vorgelesen – gut gemeint und in der Praxis unbrauchbar.
         Stattdessen setzt app.js nach dem Wechsel den Fokus hierher;
         tabindex="-1" macht das möglich, ohne den Bereich in die
         Tabulatorreihenfolge aufzunehmen. -->
    <main class="ci-inhalt">
        <div class="ci-inhalt-innen" id="ansicht" tabindex="-1"></div>
    </main>
</div>

<!-- Die Meldung erschien und verschwand, ohne dass ein Bildschirmleser
     etwas davon mitbekam: Wer nicht sieht, erfuhr nicht, ob das
     Speichern geklappt hat. role="status" sagt sie an, ohne die
     laufende Vorlesung zu unterbrechen. Sie liegt außerhalb der Hülle,
     weil sie fest am unteren Rand schwebt. -->
<div id="meldung" class="meldung" role="status" aria-live="polite" hidden></div>

<script src="/vendor/ci-css/ci-shell.js?v=20260817232449"></script>
<script src="/app.js?v=20260817232449"></script>
</body>
</html>
